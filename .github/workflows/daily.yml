# Free scheduling: GitHub Actions (public repos: free; private: 2,000 free min/month,
# this job uses ~2-4 min/run, two runs a day). No API keys required. Never places bets.
name: daily-research   # Sports Betting Doyen
on:
  schedule:
    # Twice a day (issue #63; was once a day since #53). GitHub drops many scheduled runs, most of all
    # at the top of the hour, and often starts them late, so each primary run is at an unusual minute
    # shortly before the target time.
    # Cron is UTC and does not follow daylight saving time: in winter (EST) the primaries land at
    # 5:47 AM / 5:47 PM New York time; in summer (EDT) one hour later, at 6:47 AM / 6:47 PM. Accepted.
    # Morning slot: settles yesterday's games, builds and records today's parlays, builds previews,
    # and spends about half of the day's Odds API allowance (today's games first).
    - cron: "47 10 * * *"
    # Evening slot: settles games finished today, refreshes prices with the rest of the allowance,
    # rebuilds previews and only ADDS parlays from games not yet started (recorded ones never change).
    - cron: "47 22 * * *"
    # Backups. Each exits early (no Odds API call, no commit) when its own slot (morning = before
    # 2 PM New York, evening = after) already succeeded that New York day (data/last_daily_run.json,
    # see sbi/run_marker.py). Morning backups: 12:29 and 14:13 UTC. Evening backups: 23:29 and 01:13 UTC
    # (01:13 UTC is still the previous evening in New York).
    - cron: "29 12 * * *"
    - cron: "13 14 * * *"
    - cron: "29 23 * * *"
    - cron: "13 1 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write      # failure alert: open/close the 'data-run-failed' issue (built-in token only)
concurrency:
  group: daily-research
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Backup crons only: skip when this slot's (New York) run already succeeded today. Standard
      # library only, before installing requirements. Manual runs and the two primary crons always run.
      - name: Backup run gate
        id: gate
        if: github.event_name == 'schedule' && github.event.schedule != '47 10 * * *' && github.event.schedule != '47 22 * * *'
        run: python -m sbi.run_marker >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Restore HTTP cache (avoids re-fetching past ESPN scoreboards)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: data/cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - if: steps.gate.outputs.skip != 'true'
        run: python -m pytest -q
      - name: Daily pipeline
        if: steps.gate.outputs.skip != 'true'
        env:
          SBI_TIMEZONE: ${{ vars.SBI_TIMEZONE || 'America/New_York' }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional; connector skips itself if empty
        run: python -m sbi daily
      - name: Commit results
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "sbi-bot"
          git config user.email "sbi-bot@users.noreply.github.com"
          python -c "import sqlite3; c=sqlite3.connect('data/sbi.sqlite'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          git add data/sbi.sqlite data/*.json data/analysis data/backtest reports docs/dev docs/data ledger || true
          git diff --cached --quiet || git commit -m "Doyen research run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      # Failure alert (owner request 2026-11-23): GitHub emails the owner when this issue is opened or
      # commented on. Built-in GITHUB_TOKEN only; no secret, no cost. Never labelled ready-for-claude.
      - name: Alert the owner when the data run fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create data-run-failed --color B60205 --description "Automatic alert: daily data run failed" --force --repo "$GITHUB_REPOSITORY" || true
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label data-run-failed --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "The data run failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label data-run-failed --title "Data run failed: the site is not updating" \
              --body "The scheduled data run failed, so the site did not update. Details: $RUN_URL. This issue closes itself after the next successful run."
          fi
      - name: Close the failure alert after a successful run
        if: success() && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label data-run-failed --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Recovered: this run succeeded and the site is updated. $RUN_URL"
          done
